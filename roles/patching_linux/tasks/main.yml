---
# tasks file for roles/patching_linux

- name: Check for available updates (RHEL/CentOS)
  ansible.builtin.dnf:
    list: updates
  register: dnf_updates
  when: ansible_os_family == "RedHat"

- name: Apply security patches
  ansible.builtin.dnf:
    name: "*"
    security: yes
    state: latest
  when: ansible_os_family == "RedHat"

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot server if necessary
  ansible.builtin.reboot:
    msg: "Rebooting to apply security patches"
    pre_reboot_delay: 10
    reboot_timeout: 600
  when: reboot_required.stat.exists or (dnf_updates.changed | default(false))
